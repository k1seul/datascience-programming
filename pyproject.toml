[project]
name = "datascience-programming"
version = "0.1.0"
description = "데이터사이언스를 위한 프로그래밍 실습 — 매주 C / C++ / Python 으로 풀고 pytest 로 채점한다"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py"]
testpaths = ["exercises"]
norecursedirs = ["templates", "build", ".venv", ".git"]
addopts = "-q --strict-markers"
# Mis-linked pointers hang easily. The thread method also catches loops inside C.
timeout = 20
timeout_method = "thread"
markers = [
    "python: Python task",
    "c: C task",
    "cpp: C++ task",
    "impl: build the data structure itself",
    "easy: easy",
    "medium: medium",
    "hard: hard",
]

[tool.ruff]
line-length = 100
# Code blocks inside problem statements are aligned on purpose; keep the formatter out.
exclude = ["templates", "build", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
