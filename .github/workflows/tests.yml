name: tests

# Runs for anyone who pushes, including forks and pull requests.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    name: grade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check compilers
        run: |
          cc --version | head -1
          c++ --version | head -1

      - name: Install dependencies
        run: uv sync --locked

      # Tasks that still carry a TODO are not failures. Only a task someone worked on
      # that breaks, or one that hangs, turns the run red. The per-task table is
      # written to the run summary page.
      - name: Grade
        run: uv run runner.py ci

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
