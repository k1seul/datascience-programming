name: submit

# Pick a week from the Actions tab and the submission zip comes back as an artifact.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "주차 (1, week_01, linked_list)"
        required: true
        default: "1"
      name:
        description: "파일 이름 뒤에 붙일 이름이나 학번 (선택)"
        required: false
        default: ""
      with_problem:
        description: "problem.md 도 함께 넣기"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zip:
    name: build submission zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build zip
        env:
          WEEK: ${{ inputs.week }}
          STUDENT: ${{ inputs.name }}
          WITH_PROBLEM: ${{ inputs.with_problem }}
        run: |
          args=(submit "$WEEK")
          [ -n "$STUDENT" ] && args+=(--name "$STUDENT")
          [ "$WITH_PROBLEM" = "true" ] && args+=(--with-problem)
          uv run runner.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: submission
          path: submissions/*.zip
          if-no-files-found: error
